<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Level Generator Tool</title>
<style>
body { margin:0; font-family:Arial; background:#0f1220; color:#eaeaf0;}
h1 { padding:16px; background:#1a1f3c; font-size:20px; margin:0;}
.container { display:flex; height:calc(100vh - 56px);}
.panel { padding:16px; overflow:auto; box-sizing:border-box;}
.left { width:40%; border-right:1px solid #2a2f55;}
.right { width:60%;}
label { font-size:12px; display:block; margin-top:8px;}
input, select, textarea, button {
  width:100%; margin-top:4px; padding:6px;
  background:#1a1f3c; color:#fff; border:1px solid #2a2f55;
}
button { background:#4c5cff; border:none; margin-top:16px; cursor:pointer;}
.warning { color:#ff9f43; font-size:12px; margin-top:4px;}
.output { white-space:pre; font-size:11px; background:#151933; padding:12px; border:1px solid #2a2f55;}
</style>
</head>

<body>
<h1>Level Generator Tool (Multi-Level Prototype)</h1>

<div class="container">
<div class="panel left">

<label>Total Levels</label>
<input id="totalLevels" type="number" value="5">

<label>Level Duration (s)</label>
<input id="levelDuration" type="number" value="90">

<label>Wave Duration (s)</label>
<input id="waveDuration" type="number" value="15">

<label>Wave Count</label>
<input id="waveCount" type="number" value="6">
<div id="durationWarning" class="warning"></div>

<label>Global Required Mechanics</label>
<select id="globalMechanics" multiple>
<option selected>Swarm</option>
<option selected>Elite</option>
<option>Pushable</option>
<option>Redbox</option>
<option>Multiplier Gate</option>
</select>

<label>Difficulty Curve</label>
<select id="difficultyCurve">
<option selected>Linear</option>
<option>Stepped</option>
<option>Spike</option>
</select>

<label>Max Elite Per Level</label>
<input id="maxElite" type="number" value="3">

<button onclick="generate()">Generate Levels</button>
</div>

<div class="panel right">
<h3>CSV Output (Wave Table)</h3>
<div id="output" class="output">Click Generate</div>
</div>
</div>

<script>
function getDifficultyFactor(index, total, curve) {
  const t = index / (total - 1 || 1);
  if (curve === "Spike") return Math.pow(t, 2);
  if (curve === "Stepped") return Math.round(t * 3) / 3;
  return t;
}

function generate() {
  const totalLevels = +totalLevelsInput.value;
  const levelDuration = +levelDurationInput.value;
  const waveDuration = +waveDurationInput.value;
  const waveCount = +waveCountInput.value;
  const curve = difficultyCurve.value;
  const maxElite = +maxEliteInput.value;

  if (waveDuration * waveCount > levelDuration) {
    durationWarning.textContent = "Wave duration * wave count exceeds level duration!";
  } else {
    durationWarning.textContent = "";
  }

  let csv = "level,waveId,patternId,startAt,comment\n";

  for (let l = 1; l <= totalLevels; l++) {
    const difficulty = getDifficultyFactor(l - 1, totalLevels, curve);
    let eliteUsed = 0;

    for (let w = 1; w <= waveCount; w++) {
      let t = 0;

      csv += `${l},${w},1002,${t},swarm start\n`;
      t += 10;

      if (eliteUsed < maxElite && Math.random() < difficulty) {
        csv += `${l},${w},971,${t},elite spawn\n`;
        eliteUsed++;
        t += 3;
      }

      csv += `${l},${w},993,${t},swarm stop\n`;
    }
  }

  output.textContent = csv;
}

const totalLevelsInput = document.getElementById("totalLevels");
const levelDurationInput = document.getElementById("levelDuration");
const waveDurationInput = document.getElementById("waveDuration");
const waveCountInput = document.getElementById("waveCount");
const difficultyCurve = document.getElementById("difficultyCurve");
const maxEliteInput = document.getElementById("maxElite");
const durationWarning = document.getElementById("durationWarning");
const output = document.getElementById("output");
</script>
</body>
</html>
