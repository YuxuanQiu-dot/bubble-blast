<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>泡泡爆破：霓虹节拍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fascinate+Inline&family=Russo+One&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; touch-action: none;
            font-family: 'Russo One', sans-serif;
            -webkit-user-select: none; user-select: none;
        }

        #game-container {
            position: relative;
            width: 375px; height: 667px;
            background: radial-gradient(circle at center, #1a0033 0%, #000 100%);
            box-shadow: 0 0 100px rgba(255, 0, 255, 0.4);
            border: 8px solid;
            border-image: linear-gradient(var(--angle), #ff00ff, #00ffff, #ff00ff) 1;
            border-radius: 24px;
            overflow: hidden;
            --angle: 0deg;
            animation: rotateBorder 4s linear infinite;
            transition: background 0.1s ease;
        }
        @keyframes rotateBorder { to { --angle: 360deg; } }
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

        #top-panel {
            position: absolute; top: 15px; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            z-index: 100; pointer-events: none;
        }
        #score-container {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(0,0,0,0.7); padding: 10px 30px;
            border-radius: 15px; border: 2px solid #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        #current-score { font-size: 34px; color: #fff; font-family: 'Fascinate Inline'; text-shadow: 0 0 10px #ff00ff; }
        #target-score { font-size: 16px; color: #00ffff; margin-top: -2px; opacity: 0.8; }
        
        #energy-panel {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        /* 能量条 - 用于点亮下一盏灯 */
        #energy-bar-container { width: 160px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,255,255,0.3); }
        #energy-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff99, #00ffff); box-shadow: 0 0 10px #00ffff; transition: width 0.15s ease; }

        #slots-container {
            display: flex;
            gap: 8px;
            min-height: 18px;
            align-items: center;
        }
        .energy-slot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .energy-slot.active {
            background: #00ffff;
            border-color: #fff;
            box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
            transform: scale(1.3);
        }
        /* 灯点亮时的超强闪烁动画 */
        .energy-slot.lighting {
            animation: slotLightUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slotLightUp {
            0% { transform: scale(1); background: rgba(255,255,255,0.05); box-shadow: none; }
            20% { transform: scale(2.5); background: #fff; box-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff, 0 0 120px rgba(0,255,255,0.8); }
            40% { transform: scale(1.8); background: #00ffff; box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff; }
            60% { transform: scale(2.2); background: #fff; box-shadow: 0 0 50px #00ffff, 0 0 100px #00ffff; }
            80% { transform: scale(1.5); background: #00ffff; box-shadow: 0 0 25px #00ffff, 0 0 50px #00ffff; }
            100% { transform: scale(1.3); background: #00ffff; box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff; }
        }
        /* 所有灯亮时的脉冲效果 */
        .energy-slot.all-lit {
            animation: allLitPulse 0.7s ease-in-out;
        }
        @keyframes allLitPulse {
            0%, 100% { transform: scale(1.3); box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff; }
            25% { transform: scale(1.8); box-shadow: 0 0 30px #fff, 0 0 60px #00ffff, 0 0 90px #00ffff; }
            50% { transform: scale(1.5); box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            75% { transform: scale(1.7); box-shadow: 0 0 25px #fff, 0 0 50px #00ffff; }
        }
        #spin-text { 
            color:#ff00ff; font-size:18px; font-family: 'Fascinate Inline';
            text-shadow:0 0 10px #ff00ff;
            position: relative;
        }
        .spin-pop { animation: spinPopAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes spinPopAnim {
            0% { transform: scale(1) rotate(0deg); color: #ff00ff; }
            15% { transform: scale(2.5) rotate(-10deg); color: #fff; text-shadow: 0 0 40px #ff00ff, 0 0 80px #ff00ff, 0 0 120px #ff00ff; }
            30% { transform: scale(1.8) rotate(8deg); color: #00ffff; text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff; }
            45% { transform: scale(2.2) rotate(-5deg); color: #fff; text-shadow: 0 0 50px #ff00ff, 0 0 100px #ff00ff; }
            60% { transform: scale(1.6) rotate(3deg); color: #ffff00; text-shadow: 0 0 40px #ffff00; }
            75% { transform: scale(1.3) rotate(-2deg); color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
            100% { transform: scale(1) rotate(0deg); color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        }
        /* SPIN +1 浮动提示 */
        .spin-plus-one {
            position: absolute;
            color: #00ffff;
            font-size: 28px;
            font-family: 'Fascinate Inline';
            font-weight: 900;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            pointer-events: none;
            z-index: 250;
            animation: spinPlusOneAnim 1s ease-out forwards;
        }
        @keyframes spinPlusOneAnim {
            0% { transform: translate(-50%, 0) scale(0) rotate(-20deg); opacity: 0; }
            20% { transform: translate(-50%, -20px) scale(2) rotate(10deg); opacity: 1; }
            40% { transform: translate(-50%, -40px) scale(1.5) rotate(-5deg); opacity: 1; }
            100% { transform: translate(-50%, -80px) scale(1) rotate(0deg); opacity: 0; }
        }

        .energy-shard {
            position: absolute;
            width: 2px; height: 2px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 300;
        }

        #praise-display {
            position: absolute; width: 100%; top: 40%;
            text-align: center; color: #fff;
            font-size: 55px; font-weight: 900;
            z-index: 200; pointer-events: none;
            font-family: 'Fascinate Inline', cursive;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .praise-anim { animation: praiseIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes praiseIn {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            30% { transform: scale(1.4) rotate(10deg); opacity: 1; }
            70% { transform: scale(1.2) rotate(-5deg); opacity: 1; }
            100% { transform: scale(2) rotate(0deg); opacity: 0; }
        }

        .floating-text {
            position: absolute; color: #fff; font-weight: 900; font-size: 28px;
            text-shadow: 0 0 10px #ff00ff; pointer-events: none; z-index: 200;
            animation: floatPop 0.8s ease-out forwards;
        }
        @keyframes floatPop {
            0% { transform: translate(-50%, 0) scale(0); opacity: 0; }
            25% { opacity: 1; transform: translate(-50%, -40px) scale(1.4); }
            100% { transform: translate(-50%, -120px) scale(1); opacity: 0; }
        }

        #lever-container {
            position: absolute; top: 120px; right: 20px;
            width: 50px; height: 80px; z-index: 150;
            cursor: not-allowed; opacity: 0.3; transition: 0.3s;
        }
        #lever-container.ready { cursor: pointer; opacity: 1; filter: drop-shadow(0 0 10px #ff00ff); }
        #lever-base { position: absolute; bottom: 0; width: 36px; height: 36px; background: #222; border-radius: 50%; left: 7px; border: 2px solid #fff; }
        #lever-stick { position: absolute; bottom: 15px; left: 20px; width: 10px; height: 50px; background: #fff; border-radius: 5px; transform-origin: bottom center; }
        #lever-knob { position: absolute; top: -12px; left: -10px; width: 30px; height: 30px; background: #ff00ff; border-radius: 50%; box-shadow: 0 0 10px #ff00ff; }
        #lever-container.pulling #lever-stick { transform: rotateX(75deg) scaleY(0.4); }

        #level-up-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(255,0,255,0.3); z-index: 400; pointer-events: none; animation: flash 0.6s; }
        @keyframes flash { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        #gameOver { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 500; color: #fff; }
        button { margin-top: 30px; padding: 20px 60px; font-size: 24px; background: #ff00ff; color: #fff; border: none; border-radius: 50px; cursor: pointer; font-weight: 900; box-shadow: 0 0 20px #ff00ff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-panel">
        <div style="color:#00ffff; font-size:14px; letter-spacing:2px; margin-bottom:5px;" id="level-text">LEVEL 1</div>
        <div id="score-container">
            <div id="current-score">0</div>
            <div id="target-score">GOAL: 500</div>
        </div>
        <div id="energy-panel">
            <div id="energy-bar-container">
                <div id="energy-bar-fill"></div>
            </div>
            <div id="slots-container"></div>
            <div id="spin-text">SPINS: 0</div>
        </div>
    </div>

    <div id="praise-display">SWEET!</div>
    <div id="level-up-overlay"><h1 style="color:#fff; font-size:42px; text-shadow:0 0 20px #ff00ff;">NEXT BLIND</h1></div>
    
    <div id="lever-container" onclick="pullLever()">
        <div id="lever-base"></div>
        <div id="lever-stick"><div id="lever-knob"></div></div>
    </div>

    <div id="gameOver">
        <h1 style="font-size: 50px; color:#ff00ff;">BUSTED</h1>
        <p id="finalScore" style="font-size: 32px; margin-top:20px;">0</p>
        <button onclick="location.reload()">NEW RUN</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
(() => {
    const { Engine, Render, Runner, World, Bodies, Body, Events, Composite, Query, Vector } = Matter;

    const width = 375, height = 667;
    let currentScore = 0;
    let isGameOver = false, isPulling = false;
    let level = 1, goalScore = 500, charges = 0;
    
    // 能量系统核心变量
    let currentEnergy = 0;  // 当前能量（用于点亮下一盏灯）
    let litSlots = 0;       // 已点亮的灯数量
    let isResetting = false; // 标志是否正在重置灯（防止重置期间的能量处理冲突）
    const ENERGY_PER_SLOT = 30; // 点亮一盏灯需要的能量

    const COLORS = ['#FF0055', '#00FF99', '#00D9FF', '#FFD700', '#CC00FF'];
    const PRAISES = ["SWEET!", "TASTY!", "DELICIOUS!", "FANTASTIC!", "UNBELIEVABLE!!", "DISCO KING!"];

    const engine = Engine.create();
    engine.world.gravity.y = 1.4;
    engine.enableSleeping = true; 
    engine.positionIterations = 10; 

    const container = document.getElementById('game-container');
    const render = Render.create({
        element: container, engine: engine,
        options: { width, height, wireframes: false, background: 'transparent', pixelRatio: window.devicePixelRatio, showSleeping: false }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    World.add(engine.world, [
        Bodies.rectangle(width/2, height + 25, width, 50, { isStatic: true }),
        Bodies.rectangle(-25, height/2, 50, height, { isStatic: true }),
        Bodies.rectangle(width + 25, height/2, 50, height, { isStatic: true })
    ]);

    // 获取当前关卡需要的灯数量（修复：根据关卡等级决定，最多5个）
    function getRequiredSlots() {
        return Math.min(5, level);
    }

    // 获取能量增益乘数（随关卡增加，保持游戏平衡）
    function getEnergyMultiplier() {
        // level 1: 1x, level 2: 1.4x, level 3: 1.8x, level 4: 2.2x, level 5: 2.6x
        return 1 + (level - 1) * 0.4;
    }

    function createBubble(x, y) {
        let color = COLORS[Math.floor(Math.random() * COLORS.length)];
        let label = 'normal', rand = Math.random();
        if (rand < 0.008) label = 'bomb'; 
        else if (rand < 0.007) label = 'rainbow'; 
        const b = Bodies.circle(x, y, 22, {
            restitution: 0.5, friction: 0.3, frictionAir: 0.01, label,
            customColor: label === 'rainbow' ? 'ANY' : color,
            render: { visible: false, fillStyle: label === 'bomb' ? '#111' : color, strokeStyle: '#fff', lineWidth: 2 }
        });
        World.add(engine.world, b);
    }

    function spawnEnergyShard(startX, startY, color) {
        const count = 4 + Math.floor(Math.random() * 3);
        for(let i=0; i<count; i++) {
            const shard = document.createElement('div');
            shard.className = 'energy-shard';
            shard.style.backgroundColor = color;
            shard.style.boxShadow = `0 0 4px ${color}`;
            shard.style.left = startX + 'px';
            shard.style.top = startY + 'px';
            container.appendChild(shard);

            const target = document.getElementById('energy-bar-container').getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const targetX = (target.left + target.width/2) - containerRect.left;
            const targetY = (target.top + target.height/2) - containerRect.top;

            shard.animate([
                { transform: 'scale(1) translate(0, 0)', opacity: 1 },
                { transform: `scale(1.5) translate(${(Math.random()-0.5)*60}px, ${(Math.random()-0.5)*60}px)`, opacity: 1, offset: 0.1 },
                { transform: `scale(0.1) translate(${targetX - startX}px, ${targetY - startY}px)`, opacity: 0.2 }
            ], {
                duration: 400 + Math.random() * 400,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                fill: 'forwards'
            }).onfinish = () => shard.remove();
        }
    }

    // 核心能量逻辑（修复：灯点亮后先显示，再延迟重置）
    function addEnergy(gain) {
        const oldCharges = charges;
        const requiredSlots = getRequiredSlots();
        
        // 应用能量乘数
        const adjustedGain = gain * getEnergyMultiplier();
        currentEnergy += adjustedGain;

        // 如果正在重置灯，先累积能量，不处理点灯逻辑
        if (isResetting) {
            syncUI();
            return;
        }

        // 能量条满了 -> 点亮一盏灯
        let allLit = false;
        while (currentEnergy >= ENERGY_PER_SLOT && !isResetting) {
            currentEnergy -= ENERGY_PER_SLOT;
            litSlots++;
            
            // 检查是否所有灯都亮了
            if (litSlots >= requiredSlots) {
                allLit = true;
                isResetting = true;
                break;
            }
        }

        // 先更新UI，显示灯被点亮的状态
        syncUI();
        
        // 如果有新灯被点亮，添加点亮动画
        animateLitSlots();

        // 如果所有灯都亮了 -> SPIN +1，然后延迟重置
        if (allLit) {
            charges++;
            flashBackground('#00ffff', 400);
            shakeScreen(15);
            
            // SPIN 增加时的超强动画
            showSpinGainEffect();
            
            // 为所有亮着的灯添加脉冲动画
            const allSlots = document.querySelectorAll('.energy-slot.active');
            allSlots.forEach(slot => {
                slot.classList.add('all-lit');
            });
            
            // 延迟重置灯，让玩家看到所有灯都亮的效果
            setTimeout(() => {
                litSlots = 0;
                isResetting = false;
                syncUI();
            }, 700);
        } else if (charges > oldCharges) {
            // SPIN 增加时的动画（兜底逻辑）
            showSpinGainEffect();
        }
    }

    // 为新点亮的灯添加动画效果
    function animateLitSlots() {
        const slots = document.querySelectorAll('.energy-slot.active');
        slots.forEach((slot, index) => {
            if (!slot.classList.contains('lighting')) {
                slot.classList.add('lighting');
                // 动画结束后移除类
                setTimeout(() => slot.classList.remove('lighting'), 600);
            }
        });
    }

    function syncUI() {
        const requiredSlots = getRequiredSlots();
        
        // 1. 更新能量条（代表点亮下一盏灯的进度）
        const energyPercent = (currentEnergy / ENERGY_PER_SLOT) * 100;
        document.getElementById('energy-bar-fill').style.width = Math.min(100, energyPercent) + '%';

        // 2. 更新灯位
        const containerUI = document.getElementById('slots-container');
        containerUI.innerHTML = '';
        for(let i=0; i<requiredSlots; i++) {
            const slot = document.createElement('div');
            slot.className = 'energy-slot' + (i < litSlots ? ' active' : '');
            containerUI.appendChild(slot);
        }

        // 3. 更新 SPIN 文本
        document.getElementById('spin-text').innerText = `SPINS: ${charges}`;

        // 4. 更新摇杆状态
        const lever = document.getElementById('lever-container');
        if (charges > 0) lever.classList.add('ready'); else lever.classList.remove('ready');
    }

    function updateScore(gain, x, y) {
        currentScore += gain;
        document.getElementById('current-score').innerText = Math.floor(currentScore).toLocaleString();
        showFloatingText(x, y, "+" + Math.floor(gain).toLocaleString());
        
        if (currentScore >= goalScore) {
            nextLevel();
        } else {
            syncUI();
        }
    }

    function nextLevel() {
        level++;
        // 不再清零分数，分数继续累积
        goalScore = Math.floor(500 * Math.pow(2.0, level - 1));
        
        document.getElementById('level-text').innerText = `LEVEL ${level}`;
        document.getElementById('target-score').innerText = `GOAL: ${goalScore.toLocaleString()}`;
        
        const overlay = document.getElementById('level-up-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => overlay.style.display = 'none', 600);
        
        syncUI();
    }

    function flashBackground(color, duration = 150) {
        container.style.background = color + "44"; 
        setTimeout(() => { container.style.background = "radial-gradient(circle at center, #1a0033 0%, #000 100%)"; }, duration);
    }

    function shakeScreen(intensity = 5, applyFactor = true) {
        const factor = applyFactor ? 2 : 1;
        container.animate([
            { transform: `translate(${Math.random()*intensity*factor}px, ${Math.random()*intensity*factor}px)` },
            { transform: `translate(${-Math.random()*intensity*factor}px, ${-Math.random()*intensity*factor}px)` },
            { transform: `translate(${Math.random()*intensity*0.5*factor}px, ${-Math.random()*intensity*0.5*factor}px)` },
            { transform: `translate(0,0)` }
        ], { duration: 100, iterations: 1 });
    }

    function showPraise(count, x, y, customColor) {
        let text = "", intensity = 0, flashDur = 150;
        if (count >= 20) { text = PRAISES[5]; intensity = 100; flashDur = 900; }
        else if (count >= 15) { text = PRAISES[4]; intensity = 60; flashDur = 700; }
        else if (count >= 12) { text = PRAISES[3]; intensity = 50; flashDur = 650; }
        else if (count >= 9)  { text = PRAISES[2]; intensity = 40; flashDur = 500; }
        else if (count >= 6)  { text = PRAISES[1]; intensity = 30; flashDur = 400; }
        else if (count >= 4)  { text = PRAISES[0]; intensity = 20; flashDur = 300; }
        else return;
        const el = document.getElementById('praise-display');
        el.innerText = text; el.className = "";
        void el.offsetWidth; el.className = "praise-anim";
        el.style.color = customColor || COLORS[Math.floor(Math.random()*COLORS.length)];
        shakeScreen(intensity);
        flashBackground(el.style.color, flashDur);
    }

    function showFloatingText(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.innerText = text;
        container.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    // SPIN 增加时的超强特效
    function showSpinGainEffect() {
        const spinEl = document.getElementById('spin-text');
        spinEl.classList.remove('spin-pop');
        void spinEl.offsetWidth; 
        spinEl.classList.add('spin-pop');
        
        // 创建 "+1 SPIN!" 浮动提示
        const plusOne = document.createElement('div');
        plusOne.className = 'spin-plus-one';
        plusOne.innerText = '+1 SPIN!';
        const spinRect = spinEl.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        plusOne.style.left = (spinRect.left + spinRect.width/2 - containerRect.left) + 'px';
        plusOne.style.top = (spinRect.top - containerRect.top) + 'px';
        container.appendChild(plusOne);
        setTimeout(() => plusOne.remove(), 1000);
        
        // 创建放射状粒子
        for(let i = 0; i < 12; i++) {
            const particle = document.createElement('div');
            particle.style.cssText = `
                position: absolute;
                width: 6px; height: 6px;
                background: ${i % 2 === 0 ? '#00ffff' : '#ff00ff'};
                border-radius: 50%;
                pointer-events: none;
                z-index: 250;
                box-shadow: 0 0 10px ${i % 2 === 0 ? '#00ffff' : '#ff00ff'};
            `;
            particle.style.left = (spinRect.left + spinRect.width/2 - containerRect.left) + 'px';
            particle.style.top = (spinRect.top + spinRect.height/2 - containerRect.top) + 'px';
            container.appendChild(particle);
            
            const angle = (i / 12) * Math.PI * 2;
            const distance = 80 + Math.random() * 40;
            particle.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px)) scale(0)`, opacity: 0 }
            ], {
                duration: 600,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                fill: 'forwards'
            }).onfinish = () => particle.remove();
        }
    }

    window.pullLever = function() {
        if (isPulling || charges <= 0) return;
        charges--; syncUI();
        isPulling = true;
        document.getElementById('lever-container').classList.add('pulling');
        let count = 0;
        const totalBubbles = 50; // 每次spin掉落50个球
        const spawnInterval = setInterval(() => {
            createBubble(Math.random() * (width - 60) + 30, -40);
            count++;
            if (count >= totalBubbles) clearInterval(spawnInterval);
        }, 25); // 稍微加快掉落速度
        setTimeout(() => {
            document.getElementById('lever-container').classList.remove('pulling');
            isPulling = false;
        }, 800); // 延长一点等待时间以配合更多的球
    };

    function applyShockwave(pos, r, force) {
        Composite.allBodies(engine.world).forEach(b => {
            if (b.isStatic) return;
            const dist = Vector.magnitude(Vector.sub(b.position, pos));
            if (dist < r && dist > 0) {
                const n = Vector.normalise(Vector.sub(b.position, pos));
                Body.applyForce(b, b.position, Vector.mult(n, (1 - dist/r) * force));
            }
        });
    }

    async function chainExplode(startBody) {
        if (startBody.isPopped) return;
        let targetColor = startBody.customColor;
        const centerPos = { ...startBody.position };
        const toExplode = [];
        const processed = new Set([startBody.id]);
        const queue = [startBody];

        while(queue.length > 0) {
            const curr = queue.shift();
            toExplode.push(curr);
            Composite.allBodies(engine.world).filter(b => {
                if (b.isStatic || processed.has(b.id) || b.isPopped) return false;
                if (b.label !== 'normal' && b.label !== 'rainbow') return false;
                return (b.label === 'rainbow' || b.customColor === targetColor || targetColor === 'ANY') && Vector.magnitude(Vector.sub(b.position, curr.position)) < 55;
            }).forEach(n => { processed.add(n.id); queue.push(n); });
        }

        if (toExplode.length < 2) return;
        toExplode.sort((a, b) => Vector.magnitudeSquared(Vector.sub(a.position, centerPos)) - Vector.magnitudeSquared(Vector.sub(b.position, centerPos)));

        showPraise(toExplode.length, centerPos.x, centerPos.y, startBody.render.fillStyle);
        updateScore(toExplode.length * 20, centerPos.x, centerPos.y);
        addEnergy(toExplode.length * 1.2); // 消除泡泡获得能量（减少20%，会自动应用乘数）
        
        for(let b of toExplode) {
            b.isPopped = true;
            spawnEnergyShard(b.position.x, b.position.y, b.render.fillStyle);
            applyShockwave(b.position, 100, 0.005);
            shakeScreen(1.5);
            spawnBurst(b.position.x, b.position.y, b.render.fillStyle, toExplode.length > 10);
            World.remove(engine.world, b);
            await new Promise(r => setTimeout(r, 50));
        }
    }

    async function triggerBomb(bombBody) {
        if (bombBody.isPopped) return;
        bombBody.isPopped = true;
        const pos = { ...bombBody.position };
        const nearby = Composite.allBodies(engine.world).filter(b => !b.isStatic && b !== bombBody && Vector.magnitude(Vector.sub(b.position, pos)) < 200);
        
        // 点击炸弹奖励一次 SPIN
        charges++;
        syncUI();
        showSpinGainEffect();
        
        let bombTotalGain = 0;
        const counted = new Set();
        for (const b of nearby) {
            if (counted.has(b.id)) continue;
            const cluster = [];
            const q = [b], v = new Set([b.id]), tc = b.customColor;
            while(q.length > 0) {
                const c = q.shift(); cluster.push(c); counted.add(c.id);
                nearby.filter(n => !v.has(n.id) && !n.isPopped && !counted.has(n.id) && (n.label==='normal'||n.label==='rainbow') && (n.label==='rainbow'||n.customColor===tc||tc==='ANY') && Vector.magnitude(Vector.sub(n.position, c.position)) < 55)
                .forEach(n => { v.add(n.id); q.push(n); });
            }
            bombTotalGain += (cluster.length >= 2 ? cluster.length * 20 : 10);
        }

        updateScore(bombTotalGain, pos.x, pos.y);
        showPraise(nearby.length, pos.x, pos.y, '#FF00FF');
        shakeScreen(25, false);
        spawnBurst(pos.x, pos.y, '#FF00FF', true);
        applyShockwave(pos, 300, 0.05);
        World.remove(engine.world, bombBody);

        for(let b of nearby) {
            b.isPopped = true;
            spawnEnergyShard(b.position.x, b.position.y, b.render.fillStyle);
            applyShockwave(b.position, 80, 0.003);
            spawnBurst(b.position.x, b.position.y, b.render.fillStyle, true);
            World.remove(engine.world, b);
            await new Promise(r => setTimeout(r, 20));
        }
        addEnergy(nearby.length * 1.2); // 炸弹也获得能量（减少20%，会自动应用乘数）
    }

    function spawnBurst(x, y, color, isEpic) {
        const count = isEpic ? 15 : 6;
        for (let i = 0; i < count; i++) {
            const p = Bodies.circle(x, y, isEpic ? 4 : 2, { frictionAir: 0.04, collisionFilter: { group: -1 }, render: { fillStyle: isEpic ? (Math.random() > 0.5 ? '#fff' : color) : color } });
            World.add(engine.world, p);
            const f = isEpic ? 0.025 : 0.012;
            Body.applyForce(p, p.position, { x: (Math.random()-0.5)*f, y: (Math.random()-0.5)*f });
            setTimeout(() => World.remove(engine.world, p), isEpic ? 700 : 400);
        }
    }

    function handleInput(e) {
        if (isGameOver) return;
        const rect = render.canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const mousePos = { x: (clientX - rect.left) * (width / rect.width), y: (clientY - rect.top) * (height / rect.height) };
        const target = Query.point(Composite.allBodies(engine.world).filter(b => !b.isPopped), mousePos).find(b => b.label === 'bomb' || b.label === 'normal' || b.label === 'rainbow');
        if (target) { if (target.label === 'bomb') triggerBomb(target); else chainExplode(target); }
    }

    render.canvas.addEventListener('mousedown', handleInput);
    render.canvas.addEventListener('touchstart', (e) => { handleInput(e); e.preventDefault(); }, { passive: false });
    for(let i=0; i<70; i++) createBubble(Math.random()*(width-60)+30, Math.random()*(height*0.5)+(height*0.4));
    
    syncUI();

    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const time = Date.now() / 1000;
        
        Composite.allBodies(engine.world).forEach(b => {
            if (b.isStatic || b.isPopped) return;
            const x = b.position.x, y = b.position.y, r = 22, color = b.render.fillStyle;
            
            // 轻微的呼吸效果
            const breathe = 1 + Math.sin(time * 3 + b.id) * 0.03;
            const actualR = r * breathe;
            
            ctx.save();
            
            // 1. 主体 - 半透明彩色填充，更有光泽感
            ctx.globalAlpha = 0.6;
            const mainGrad = ctx.createRadialGradient(x - actualR * 0.3, y - actualR * 0.3, 0, x, y, actualR);
            mainGrad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            mainGrad.addColorStop(0.3, color + 'aa');
            mainGrad.addColorStop(0.7, color + '88');
            mainGrad.addColorStop(1, color + '44');
            ctx.beginPath();
            ctx.arc(x, y, actualR, 0, Math.PI * 2);
            ctx.fillStyle = mainGrad;
            ctx.fill();
            
            // 2. 彩虹色边缘光晕（肥皂泡特征）
            ctx.globalAlpha = 0.5;
            const edgeHue = (time * 30 + b.id * 20) % 360;
            const edgeGrad = ctx.createRadialGradient(x, y, actualR * 0.75, x, y, actualR * 1.05);
            edgeGrad.addColorStop(0, 'transparent');
            edgeGrad.addColorStop(0.5, `hsla(${edgeHue}, 100%, 70%, 0.3)`);
            edgeGrad.addColorStop(0.7, `hsla(${(edgeHue + 60) % 360}, 100%, 70%, 0.4)`);
            edgeGrad.addColorStop(0.85, `hsla(${(edgeHue + 120) % 360}, 100%, 70%, 0.3)`);
            edgeGrad.addColorStop(1, 'transparent');
            ctx.beginPath();
            ctx.arc(x, y, actualR * 1.05, 0, Math.PI * 2);
            ctx.fillStyle = edgeGrad;
            ctx.fill();
            
            // 3. 外边缘描边 - 更亮更清晰
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.arc(x, y, actualR, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            
            // 4. 主高光 - 左上角大高光（让泡泡看起来有光泽）
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.ellipse(x - actualR * 0.35, y - actualR * 0.35, actualR * 0.35, actualR * 0.25, -Math.PI / 4, 0, Math.PI * 2);
            const highGrad = ctx.createRadialGradient(x - actualR * 0.35, y - actualR * 0.35, 0, x - actualR * 0.35, y - actualR * 0.35, actualR * 0.35);
            highGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            highGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
            highGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = highGrad;
            ctx.fill();
            
            // 5. 次高光 - 右下角小高光
            ctx.beginPath();
            ctx.arc(x + actualR * 0.3, y + actualR * 0.35, actualR * 0.12, 0, Math.PI * 2);
            const secHighGrad = ctx.createRadialGradient(x + actualR * 0.3, y + actualR * 0.35, 0, x + actualR * 0.3, y + actualR * 0.35, actualR * 0.12);
            secHighGrad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            secHighGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = secHighGrad;
            ctx.fill();
            
            // 6. 顶部弧形反光
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.arc(x, y, actualR * 0.8, Math.PI * 1.1, Math.PI * 1.9);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 7. 底部柔和反光
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            ctx.arc(x, y, actualR * 0.85, Math.PI * 0.1, Math.PI * 0.4);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // 特殊泡泡效果
            if (b.label === 'bomb') {
                ctx.globalAlpha = 1;
                ctx.font = "22px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.fillText("💣", x, y);
            } else if (b.label === 'rainbow') {
                ctx.globalAlpha = 0.8;
                const hue = (time * 100) % 360;
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 1)`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(x, y, actualR + 2, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        });
    });
})();
</script>
</body>
